@if (producto(); as p) {
  <div class="fondo" (click)="cerrar()"></div>
  <div class="ventana" role="dialog" aria-modal="true" aria-labelledby="titulo-modal">
    <button type="button" class="ventana__cerrar" aria-label="Cerrar" (click)="cerrar()" autofocus>×</button>

    <div class="ventana__imagen">
      @if (conDescuento()) {
        <span class="insignia">-{{ p.descuentoPorcentaje }}%</span>
      }
      <img [src]="p.imagen" [alt]="p.nombre" />
    </div>

    <div class="ventana__info">
      <small class="texto-suave">{{ nombreMarca(p.marca) }}</small>
      <h2 id="titulo-modal">{{ p.nombre }}</h2>
      <div class="precios">
        <span class="precio">{{ precioFinal() | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</span>
        @if (conDescuento()) {
          <s>{{ p.precio | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</s>
        }
      </div>
      <p>{{ p.descripcion }}</p>

      <div class="ventana__botones">
        <button type="button" class="btn btn-dorado" (click)="agregarAlCarrito()">Agregar al carrito</button>
        <button
          type="button"
          class="btn btn-borde"
          [attr.aria-pressed]="esFavorito()"
          (click)="alternarFavorito()"
        >
          {{ esFavorito() ? '♥ En favoritos' : '♡ Favorito' }}
        </button>
      </div>
    </div>
  </div>
}
