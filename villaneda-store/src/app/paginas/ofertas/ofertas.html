<section class="contenedor ofertas" aria-labelledby="titulo-ofertas">
  <header class="banner-ofertas">
    <p class="banner-ofertas__sobretitulo">Por tiempo limitado</p>
    <h1 id="titulo-ofertas" class="titulo-pagina">Ofertas</h1>
    @if (descuentoMaximo > 0) {
      <p>Hasta <strong class="texto-dorado">{{ descuentoMaximo }} % de descuento</strong> en relojes seleccionados.</p>
    }
  </header>

  <div class="rejilla rejilla-4">
    @for (producto of ofertas; track producto.id) {
      <app-tarjeta-producto [producto]="producto" (verDetalle)="modal.abrir($event)" />
    } @empty {
      <p class="texto-suave">Por ahora no hay ofertas activas.</p>
    }
  </div>
</section>
