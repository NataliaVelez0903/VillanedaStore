<section aria-labelledby="titulo-iniciar-sesion">
  <h1 id="titulo-iniciar-sesion">Iniciar sesión</h1>
  <p>Ingresa con tu cuenta de Villaneda Store.</p>

  <form [formGroup]="formulario" novalidate>
    <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input
        id="correo"
        type="email"
        formControlName="correo"
        autocomplete="username"
        required
      />

      @if (formulario.controls.correo.touched &&
           formulario.controls.correo.invalid) {
        <p class="error" role="alert">
          Escribe un correo electrónico válido.
        </p>
      }
    </div>

    <div class="campo">
      <label for="contrasena">Contraseña</label>
      <input
        id="contrasena"
        type="password"
        formControlName="contrasena"
        autocomplete="current-password"
        required
      />

      @if (formulario.controls.contrasena.touched &&
           formulario.controls.contrasena.invalid) {
        <p class="error" role="alert">Escribe tu contraseña.</p>
      }
    </div>

    <label class="casilla" for="recordar">
      <input
        id="recordar"
        type="checkbox"
        formControlName="recordar"
      />
      Recordar mi sesión
    </label>

    <button
      class="btn btn-dorado btn-bloque"
      type="submit"
      [disabled]="formulario.invalid"
    >
      Iniciar sesión
    </button>
  </form>
</section>
